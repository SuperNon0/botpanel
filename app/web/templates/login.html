<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Connexion locale — botpanel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <style>
    :root{
      --bg:#0e0f11; --card:#1c1f25; --border:#2a2d35; --accent:#e8c547;
      --text:#f0ede6; --muted:#6b6f7a; --input:#0e0f11;
      --serif:"DM Serif Display",Georgia,serif; --mono:"DM Mono",ui-monospace,monospace;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
      font-family:var(--mono);display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:12px;padding:24px}
    .login-card{width:100%;max-width:430px;background:var(--card);border:1px solid var(--border);
      border-radius:20px;padding:34px 30px;display:flex;flex-direction:column;gap:16px}
    .login-logo{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:4px}
    .login-logo svg{width:44px;height:44px;display:block}
    .logo{font-family:var(--serif);font-size:1.7rem;line-height:1;letter-spacing:.01em}
    .logo .g{color:var(--accent)} .logo .i{color:var(--text);font-style:italic}
    .badge{align-self:center;font-family:var(--mono);font-size:.68rem;text-transform:uppercase;
      letter-spacing:.08em;color:var(--muted);background:rgba(255,255,255,.03);
      border:1px solid var(--border);border-radius:999px;padding:.4rem .95rem}
    input[type=password]{width:100%;background:var(--input);border:1px solid var(--border);
      border-radius:10px;color:var(--text);font-family:inherit;font-size:.95rem;padding:.85rem 1rem}
    input[type=password]:focus{outline:none;border-color:var(--accent)}
    .btn{width:100%;background:var(--accent);color:#1a1a1a;border:none;border-radius:10px;
      font-family:inherit;font-weight:500;font-size:.95rem;padding:.85rem 1rem;cursor:pointer}
    .btn:hover{filter:brightness(1.06)} .btn:disabled{opacity:.6;cursor:default}
    .forgot-link{text-align:center;color:var(--muted);font-size:.78rem;text-decoration:none}
    .forgot-link:hover{color:var(--text);text-decoration:underline}
    .access-note{color:var(--muted);font-size:.72rem;text-align:center;margin:0}
    .toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);background:#22232c;
      color:var(--text);border:1px solid var(--border);padding:.7rem 1.1rem;border-radius:10px;
      font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .2s}
    .toast.show{opacity:1} .toast.err{border-color:#e85c47}
  </style>
</head>
<body>
  <form class="login-card" id="login-form">
    <div class="login-logo">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <rect x="4" y="4" width="92" height="92" rx="24" fill="#1b1d26"/>
        <g stroke="#3d4152" stroke-width="6" stroke-linecap="round" fill="none">
          <line x1="26" y1="34" x2="74" y2="34"/><line x1="26" y1="50" x2="74" y2="50"/><line x1="26" y1="66" x2="74" y2="66"/>
        </g>
        <circle cx="58" cy="34" r="8" fill="#e8c547"/><circle cx="38" cy="50" r="8" fill="#8b5cf6"/><circle cx="62" cy="66" r="8" fill="#4ade80"/>
      </svg>
      <span class="logo"><span class="g">bot</span><span class="i">panel</span></span>
    </div>
    <span class="badge">administration</span>
    <input type="password" id="password" placeholder="Mot de passe" autofocus autocomplete="current-password">
    <button type="submit" class="btn" id="login-btn">Se connecter</button>
    <a class="forgot-link" href="/login/forgot">Mot de passe oublié ?</a>
    <p class="access-note">Accès local (réseau domestique) · administrateur</p>
  </form>

  <div id="toast" class="toast">Ok</div>
  <script>
    const form=document.getElementById("login-form"),btn=document.getElementById("login-btn");
    const next=new URLSearchParams(location.search).get("next")||"/dashboard";
    function toast(m,e){const t=document.getElementById("toast");t.textContent=m;t.className="toast show"+(e?" err":"");setTimeout(()=>t.className="toast",3500);}
    form.addEventListener("submit",async(ev)=>{
      ev.preventDefault();
      const password=document.getElementById("password").value;
      btn.disabled=true;btn.textContent="Connexion…";
      try{
        const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password})});
        if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.detail||("Erreur "+r.status));}
        window.location.href=next;
      }catch(e){btn.disabled=false;btn.textContent="Se connecter";toast(e.message,true);}
    });
  </script>
</body>
</html>
