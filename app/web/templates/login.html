<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f11">
  <title>Connexion locale — botpanel</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
  <link rel="stylesheet" href="/static/css/fonts.css">
  <link rel="stylesheet" href="/static/css/socle.css">
</head>
<body class="login-page">
  <form class="login-card" id="login-form">
    <div class="login-logo">
      <svg class="logo-mark" viewBox="0 0 100 100" width="44" height="44" aria-hidden="true">
        <rect x="4" y="4" width="92" height="92" rx="24" fill="#1b1d26"/>
        <g stroke="#3d4152" stroke-width="6" stroke-linecap="round" fill="none">
          <line x1="26" y1="34" x2="74" y2="34"/><line x1="26" y1="50" x2="74" y2="50"/><line x1="26" y1="66" x2="74" y2="66"/>
        </g>
        <circle cx="58" cy="34" r="8" fill="#e8c547"/><circle cx="38" cy="50" r="8" fill="#8b5cf6"/><circle cx="62" cy="66" r="8" fill="#4ade80"/>
      </svg>
      <span class="logo"><span class="g">bot</span><span class="i">panel</span></span>
    </div>
    <span class="badge">administration</span>
    <input type="password" id="password" placeholder="Mot de passe" autofocus autocomplete="current-password">
    <button type="submit" class="btn primary full" id="login-btn">Se connecter</button>
    <a class="forgot-link" href="/login/forgot">Mot de passe oublié ?</a>
    <p class="access-note">Accès local (réseau domestique) · secours</p>
  </form>

  <div id="toast" class="flash" style="position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .2s">Ok</div>
  <script>
    const form=document.getElementById("login-form"),btn=document.getElementById("login-btn");
    const next=new URLSearchParams(location.search).get("next")||"/dashboard";
    function toast(m,e){const t=document.getElementById("toast");t.textContent=m;t.className="flash "+(e?"error":"success");t.style.opacity="1";setTimeout(()=>t.style.opacity="0",3500);}
    form.addEventListener("submit",async(ev)=>{
      ev.preventDefault();
      const password=document.getElementById("password").value;
      btn.disabled=true;btn.textContent="Connexion…";
      try{
        const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password})});
        if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.detail||("Erreur "+r.status));}
        window.location.href=next;
      }catch(e){btn.disabled=false;btn.textContent="Se connecter";toast(e.message,true);}
    });
  </script>
</body>
</html>
