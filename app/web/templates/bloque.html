<!DOCTYPE html>
<html lang="fr" data-accent-defaut="lavande" data-encre-sprite="/static/encre/icones.svg">
<head>
  {% include "_encre_head.html" %}
  <title>Accès refusé — botpanel</title>
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">
      {% include "_logo.html" %}
      <span class="wm">bot<b>panel</b></span>
    </div>
    <div class="access-icon err"><svg class="i" aria-hidden="true"><use href="/static/encre/icones.svg#i-shield"/></svg></div>
    <h1 class="h-acces">Accès refusé</h1>
    {% if email and email != "—" %}<span class="mail-chip">{{ email }}</span>{% endif %}
    <p class="access-text">Ce panel est accessible <b>uniquement via Cloudflare</b>
      (connexion Google). L'accès direct n'est pas autorisé.</p>
  </div>
</body>
</html>
