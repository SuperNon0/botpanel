{% extends "base.html" %}
{% block title %}Commandes — BotPanel{% endblock %}

{% block content %}
<div class="page-header">
  <h2>Commandes slash<button type="button" class="help-dot" data-help="commands_intro">?</button></h2>
  <div class="page-tools">
    <div class="list-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="list-search" data-search="#groups-root" placeholder="Rechercher une commande" aria-label="Rechercher une commande" autocomplete="off">
    </div>
    <span class="card-row-meta" id="quota">0 / 100</span>
  </div>
</div>

<div id="groups-root" data-skeleton="3"></div>

<a href="/commands/new" class="fab" title="Nouvelle commande"><span class="fab-plus" aria-hidden="true">+</span><span>Nouveau</span></a>
{% endblock %}

{% block scripts %}
<script>
const ACTION_META = {
  message:      { label: "Réponse",      cls: "tag-green" },
  service:      { label: "Service HA",   cls: "tag-yellow" },
  script:       { label: "Script",       cls: "tag-green" },
  scene:        { label: "Scène",        cls: "tag-orange" },
  notification: { label: "Notification", cls: "tag-purple" },
};

// Resume lisible de ce que fait la commande
function actionSummary(c) {
  if (c.action_type === "service") return [c.ha_service, c.ha_entity_id].filter(Boolean).join(" → ");
  if (c.action_type === "script" || c.action_type === "scene") return c.ha_entity_id || "";
  if (c.action_type === "notification") return c.notification_slug || "";
  return "";
}

let _cmds = [];

function rowHtml(c) {
  const meta = ACTION_META[c.action_type] || { label: c.action_type, cls: "tag-muted" };
  const summary = actionSummary(c);
  const nb = (c.buttons || []).length;
  return `
    <div class="card-row">
      <div>
        <div>
          <code>/${esc(c.name)}</code>
          <button type="button" class="tag mini-toggle ${c.enabled ? "tag-green" : "tag-muted"}" data-toggle="${c.id}"
                  title="Cliquer pour ${c.enabled ? "désactiver" : "activer"}">${c.enabled ? "ON" : "OFF"}</button>
        </div>
        <div class="card-row-meta">
          ${esc(c.description)}
          &nbsp;&middot;&nbsp;<span class="tag ${meta.cls}">${esc(meta.label)}</span>
          ${summary ? `&nbsp;<code>${esc(summary)}</code>` : ""}
          ${nb ? `&nbsp;&middot;&nbsp;${nb} bouton${nb > 1 ? "s" : ""}` : ""}
          ${c.response_ephemeral ? "" : '&nbsp;<span class="tag tag-muted">PUBLIC</span>'}
        </div>
      </div>
      <div class="row-actions">
        <button class="btn btn-purple btn-small" data-test="${c.id}">Tester</button>
        <a class="btn btn-edit btn-small" href="/commands/${c.id}">Éditer</a>
        ${rowMenuHtml(c.id)}
      </div>
    </div>`;
}

async function loadCommands() {
  const root = document.getElementById("groups-root");
  const quota = document.getElementById("quota");
  try {
    const [cmds, q] = await Promise.all([API.get("/commands"), API.get("/commands/quota")]);
    _cmds = cmds;
    quota.textContent = `${q.used} / ${q.max}`;

    if (cmds.length === 0) {
      root.innerHTML = `<div class="card">` + emptyBox(ICONS.slash, "Aucune commande",
        "Ajoute une commande slash Discord : afficher une valeur HA, allumer une lumière, lancer un script…",
        '<a class="btn btn-primary btn-small" href="/commands/new">+ Nouvelle commande</a>') + `</div>`;
      return;
    }

    renderGroupedList(root, cmds, c => c.list_group, rowHtml, "bp_cmd_groups_closed");
  } catch (e) {
    root.innerHTML = `<div class="card"><div class="empty-state">Erreur : ${esc(e.message)}</div></div>`;
  }
}

document.getElementById("groups-root").addEventListener("click", async (e) => {
  const t = e.target.closest("[data-toggle],[data-test],[data-dup],[data-del]");
  if (!t) return;
  try {
    if (t.dataset.toggle) {
      const c = _cmds.find(x => x.id === +t.dataset.toggle);
      if (!c) return;
      const { id, ...payload } = c;
      await API.put(`/commands/${id}`, { ...payload, enabled: !c.enabled });
      toast(c.enabled ? `/${c.name} désactivée` : `/${c.name} activée`);
      loadCommands();
    } else if (t.dataset.test) {
      const c = _cmds.find(x => x.id === +t.dataset.test);
      const warn = c && c.action_type !== "message" ? "\nL'action sera VRAIMENT exécutée." : "";
      if (!await confirmBox(`Tester /${c ? c.name : ""} ?${warn}`)) return;
      const r = await API.post(`/commands/${t.dataset.test}/test`);
      toast("✅ OK — réponse : " + (r.message || r.title || "(vide)").slice(0, 120));
    } else if (t.dataset.dup) {
      const copy = await API.post(`/commands/${t.dataset.dup}/duplicate`);
      toast(`Clonée en /${copy.name} (désactivée)`);
      window.location.href = `/commands/${copy.id}`;
    } else if (t.dataset.del) {
      if (!await confirmBox("Supprimer cette commande ?")) return;
      await API.del(`/commands/${t.dataset.del}`);
      toast("Commande supprimée");
      loadCommands();
    }
  } catch (err) { toast(err.message, "error"); }
});

loadCommands();
</script>
{% endblock %}
