<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}BotPanel{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/style.css?v=9">
</head>
<body>

<header class="header">
  <a href="/dashboard" id="logo-link" class="logo" style="text-decoration:none; display:inline-flex; align-items:center; gap:0.5rem;">
    <svg viewBox="0 0 100 100" width="26" height="26" aria-hidden="true" style="flex:none;">
      <g stroke="currentColor" stroke-opacity="0.32" stroke-width="7" stroke-linecap="round" fill="none">
        <line x1="26" y1="34" x2="74" y2="34"/>
        <line x1="26" y1="50" x2="74" y2="50"/>
        <line x1="26" y1="66" x2="74" y2="66"/>
      </g>
      <circle cx="58" cy="34" r="8.5" fill="#e8c547"/>
      <circle cx="38" cy="50" r="8.5" fill="#8b5cf6"/>
      <circle cx="62" cy="66" r="8.5" fill="#4ade80"/>
    </svg>
    <span><span class="bot">bot</span><span class="panel">panel</span></span>
  </a>
  <div class="header-right">super-nono.cc</div>
</header>

<nav class="nav">
  <a href="/dashboard"      class="{% if active_page == 'dashboard'     %}active{% endif %}">Accueil</a>
  <a href="/notifications"  class="{% if active_page == 'notifications' %}active{% endif %}">Notifications</a>
  <a href="/commands"       class="{% if active_page == 'commands'      %}active{% endif %}">Commandes /</a>
  <a href="/monitoring"     class="{% if active_page == 'monitoring'    %}active{% endif %}">Monitoring</a>
  <a href="/historique"     class="{% if active_page == 'historique'    %}active{% endif %}">Historique</a>
  <a href="/settings"       class="{% if active_page == 'settings'      %}active{% endif %}">Parametres</a>
  <a href="/aide"           class="{% if active_page == 'aide'          %}active{% endif %}">Aide</a>
</nav>

<main>
  {% block content %}{% endblock %}
</main>

<div id="toast" class="toast">Ok</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/emoji.js"></script>
<script>
(async function() {
  const onDashboard = window.location.pathname === "/dashboard";
  const link = document.getElementById("logo-link");
  if (onDashboard) {
    try {
      const r = await API.get("/settings/home-url");
      if (r.url) link.href = r.url;
    } catch { /* garde /dashboard si erreur */ }
  }
})();
</script>
{% block scripts %}{% endblock %}

</body>
</html>
