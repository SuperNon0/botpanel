<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}BotPanel{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/style.css?v=11">
  <link rel="stylesheet" href="/static/css/animations.css?v=1">
  <link rel="stylesheet" href="/static/css/help.css?v=1">
  <link rel="stylesheet" href="/static/css/atelier.css?v=1">
  <!-- PWA (installable sur écran d'accueil) -->
  <meta name="theme-color" content="#0e0f11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="botpanel">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
</head>
<body>

<header class="header">
  <a href="/dashboard" id="logo-link" class="logo" style="text-decoration:none; display:inline-flex; align-items:center; gap:0.5rem;">
    <svg viewBox="0 0 100 100" width="26" height="26" aria-hidden="true" style="flex:none;">
      <g stroke="currentColor" stroke-opacity="0.32" stroke-width="7" stroke-linecap="round" fill="none">
        <line x1="26" y1="34" x2="74" y2="34"/>
        <line x1="26" y1="50" x2="74" y2="50"/>
        <line x1="26" y1="66" x2="74" y2="66"/>
      </g>
      <circle cx="58" cy="34" r="8.5" fill="#e8c547"/>
      <circle cx="38" cy="50" r="8.5" fill="#8b5cf6"/>
      <circle cx="62" cy="66" r="8.5" fill="#4ade80"/>
    </svg>
    <span><span class="bot">bot</span><span class="panel">panel</span></span>
  </a>
  <div class="header-right">
    <span id="user-box" style="display:none; align-items:center; gap:0.6rem;">
      <span id="user-name" style="opacity:.75;"></span>
      <a href="#" id="logout-link" title="Se déconnecter" style="text-decoration:none;">Déconnexion</a>
    </span>
  </div>
</header>

<nav class="nav" aria-label="Menu principal">
  <a href="/dashboard" class="{% if active_page == 'dashboard' %}active{% endif %}"{% if active_page == 'dashboard' %} aria-current="page"{% endif %}>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="nav-full">Accueil</span><span class="nav-short">Accueil</span>
  </a>
  <a href="/notifications" class="{% if active_page == 'notifications' %}active{% endif %}"{% if active_page == 'notifications' %} aria-current="page"{% endif %}>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="nav-full">Notifications</span><span class="nav-short">Notifs</span>
  </a>
  <a href="/commands" class="{% if active_page == 'commands' %}active{% endif %}"{% if active_page == 'commands' %} aria-current="page"{% endif %}>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m14.5 7.5-5 9"/></svg><span class="nav-full">Commandes</span><span class="nav-short">Cmd /</span>
  </a>
  <a href="/monitoring" class="{% if active_page == 'monitoring' %}active{% endif %}"{% if active_page == 'monitoring' %} aria-current="page"{% endif %}>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span class="nav-full">Monitoring</span><span class="nav-short">Suivi</span>
  </a>
  <a href="/historique" class="{% if active_page == 'historique' %}active{% endif %}"{% if active_page == 'historique' %} aria-current="page"{% endif %}>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="nav-full">Historique</span><span class="nav-short">Histo.</span>
  </a>
  <a href="/settings" class="{% if active_page == 'settings' %}active{% endif %}"{% if active_page == 'settings' %} aria-current="page"{% endif %}>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span class="nav-full">Paramètres</span><span class="nav-short">Réglages</span>
  </a>
</nav>

<main>
  {% block content %}{% endblock %}
</main>

<div id="toast" class="toast">Ok</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/emoji.js"></script>
<script src="/static/js/anim.js"></script>
<script src="/static/js/editor.js?v=1"></script>
<script src="/static/js/help-content.js?v=5"></script>
<script src="/static/js/help.js?v=2"></script>
<script src="/static/js/ux.js?v=1"></script>
<script>
  // PWA : enregistre le service worker (installable + repli hors-ligne).
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function () {});
    });
  }
</script>
<script>
(async function() {
  const onDashboard = window.location.pathname === "/dashboard";
  const link = document.getElementById("logo-link");
  if (onDashboard) {
    try {
      const r = await API.get("/settings/home-url");
      if (r.url) link.href = r.url;
    } catch { /* garde /dashboard si erreur */ }
  }
})();

// Profil / deconnexion (affiche seulement si la protection est active et connecte)
(async function() {
  try {
    const me = await API.get("/auth/me");
    if (me.enabled && me.authenticated) {
      const box = document.getElementById("user-box");
      const isCf = me.method === "cloudflare";
      document.getElementById("user-name").textContent = isCf ? (me.email || "cloudflare") : (me.username || "admin");
      box.style.display = "inline-flex";
      document.getElementById("logout-link").addEventListener("click", async (e) => {
        e.preventDefault();
        if (isCf) {
          // Session geree par Cloudflare : on se deconnecte cote Cloudflare.
          window.location.href = "/cdn-cgi/access/logout";
          return;
        }
        try { await API.post("/auth/logout"); } catch {}
        window.location.href = "/login";
      });
    }
  } catch { /* pas d'auth : rien a afficher */ }
})();
</script>
{% block scripts %}{% endblock %}

</body>
</html>
