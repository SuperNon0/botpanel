envoyer:
  name: Envoyer une notification
  description: >-
    Déclenche l'envoi d'une notification BotPanel. Le contenu est entièrement
    défini dans BotPanel ; Home Assistant ne fait que déclencher. Choisis la
    notification dans la liste déroulante (elles apparaissent automatiquement).
  fields:
    notification:
      name: Notification
      description: >-
        La notification à envoyer (liste déroulante de toutes tes notifications
        BotPanel).
      required: false
      selector:
        entity:
          integration: botpanel
          domain: button
    slug:
      name: Slug
      description: Alternative avancée — le slug de la notification (identifiant texte).
      example: notif_porte_entree
      advanced: true
      selector:
        text:
    id:
      name: ID
      description: Alternative avancée — l'identifiant numérique.
      example: 3
      advanced: true
      selector:
        number:
          mode: box
          min: 1
